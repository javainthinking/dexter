appId: ai.pickskill.desktop
productName: PickSkill
directories:
  output: release
  buildResources: build
files:
  - out/**
  # Runtime assets mirrored by scripts/bundle-worker.mjs (not a dependency tree).
  - out/main/node_modules/**
  - package.json
  - "!spike/**"
  - "!scripts/**"
  - "!e2e-shots/**"
# Dexter's SKILL.md skills ship as plain files the agent worker mounts.
extraResources:
  - from: ../../src/skills
    to: skills
    filter: ["**/*.md", "**/*.json", "**/*.txt"]
asar: true
# OpenCode's native addons (pty, tree-sitter, file watcher) must live outside the asar.
asarUnpack:
  - "**/*.node"
mac:
  category: public.app-category.finance
  # PickSkill mark (build/icon.svg → icon.png via `pnpm icon`); builder derives the .icns.
  icon: build/icon.png
  target:
    - target: dmg
      arch: [arm64, x64]
  hardenedRuntime: true
  # No Apple Developer ID yet: ad-hoc sign ("-") so Apple Silicon accepts the
  # binary (a fully unsigned arm64 app is reported as "damaged"). Users still
  # confirm the first launch in System Settings → Privacy & Security.
  # With a Developer ID, set CSC_LINK/CSC_KEY_PASSWORD + APPLE_* and drop this.
  identity: "-"
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Versionless names so pickskill.ai can link to
  # releases/latest/download/PickSkill-mac-<arch>.dmg across releases.
  artifactName: ${productName}-mac-${arch}.${ext}
dmg:
  artifactName: ${productName}-mac-${arch}.${ext}
