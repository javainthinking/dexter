<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    PickSkill app icon — the Mark from apps/web/components/logo.tsx (and
    apps/web/app/icon.svg) laid out on Apple's macOS icon grid: an 824px
    rounded square centred on a 1024px canvas. The mark occupies 84% of the
    square, as in the web Mark. Rendered to icon.png by
    scripts/render-icon.mjs; electron-builder derives the .icns from it.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#26241d"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="url(#edge)" stroke-width="4"/>
  <g transform="translate(165.92 165.92) scale(28.84)" fill="#fafafa">
    <polygon points="2.46,9.78 11.17,18.49 11.17,13.26 5.08,7.17" opacity="0.5"/>
    <polygon points="11.17,18.49 19.38,10.28 20.55,11.45 21.54,5.51 15.60,6.50 16.76,7.67 11.17,13.26"/>
  </g>
</svg>
